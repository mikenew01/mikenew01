<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Maikon Pedrosa - Senior Software Engineer">
  <title>Maikon Pedrosa — Senior Software Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04060B"/>
      <stop offset=".5" stop-color="#0A1120"/>
      <stop offset="1" stop-color="#04060B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="58%" r="60%">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity=".38"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#A9ECFF"/>
      <stop offset="1" stop-color="#4FC3F7"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00E5FF" stop-opacity=".85"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset=".35" stop-color="#00E5FF" stop-opacity=".55"/>
      <stop offset=".65" stop-color="#7C4DFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7C4DFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="340" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>

    <!-- deep grid -->
    <g stroke="#2F81F7" stroke-opacity=".07" stroke-width="1">
      <path d="M0 60H1200M0 110H1200M0 160H1200M0 210H1200M0 260H1200M0 310H1200"/>
      <path d="M60 0V340M160 0V340M260 0V340M360 0V340M460 0V340M560 0V340M660 0V340M760 0V340M860 0V340M960 0V340M1060 0V340M1160 0V340"/>
    </g>

    <!-- starfield -->
    <g fill="#CFE9FF">
      <circle cx="88" cy="46" r="1.4"><animate attributeName="opacity" values=".15;.95;.15" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="212" cy="82" r="1"><animate attributeName="opacity" values=".8;.1;.8" dur="4.3s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="38" r="1.6"><animate attributeName="opacity" values=".1;.9;.1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="66" r="1"><animate attributeName="opacity" values=".9;.2;.9" dur="5.2s" repeatCount="indefinite"/></circle>
      <circle cx="602" cy="30" r="1.2"><animate attributeName="opacity" values=".2;.85;.2" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="742" cy="72" r="1.5"><animate attributeName="opacity" values=".85;.15;.85" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="44" r="1"><animate attributeName="opacity" values=".15;.9;.15" dur="4.8s" repeatCount="indefinite"/></circle>
      <circle cx="1012" cy="78" r="1.3"><animate attributeName="opacity" values=".9;.1;.9" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="1132" cy="52" r="1.1"><animate attributeName="opacity" values=".2;.8;.2" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="286" r="1.2"><animate attributeName="opacity" values=".85;.15;.85" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="286" cy="312" r="1"><animate attributeName="opacity" values=".15;.9;.15" dur="4.6s" repeatCount="indefinite"/></circle>
      <circle cx="524" cy="298" r="1.4"><animate attributeName="opacity" values=".9;.2;.9" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="806" cy="306" r="1.1"><animate attributeName="opacity" values=".2;.9;.2" dur="5.4s" repeatCount="indefinite"/></circle>
      <circle cx="1068" cy="292" r="1.3"><animate attributeName="opacity" values=".85;.1;.85" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="40" cy="180" r="1"><animate attributeName="opacity" values=".1;.7;.1" dur="4.9s" repeatCount="indefinite"/></circle>
      <circle cx="1176" cy="196" r="1.2"><animate attributeName="opacity" values=".7;.1;.7" dur="3.9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- orbital plane -->
    <ellipse cx="600" cy="176" rx="540" ry="132" fill="none" stroke="#2F81F7" stroke-opacity=".18" stroke-width="1" stroke-dasharray="4 9"/>
    <ellipse cx="600" cy="176" rx="400" ry="96" fill="none" stroke="#7C4DFF" stroke-opacity=".14" stroke-width="1" stroke-dasharray="2 12"/>

    <!-- satellite: outer orbit -->
    <circle r="14" fill="#00E5FF" opacity=".35" filter="url(#soft)">
      <animateMotion dur="19s" repeatCount="indefinite" path="M1140,176 A540,132 0 1 1 60,176 A540,132 0 1 1 1140,176"/>
    </circle>
    <circle r="4" fill="#EAFBFF">
      <animateMotion dur="19s" repeatCount="indefinite" path="M1140,176 A540,132 0 1 1 60,176 A540,132 0 1 1 1140,176"/>
    </circle>
    <!-- satellite: inner orbit, counter phase -->
    <circle r="10" fill="#7C4DFF" opacity=".4" filter="url(#soft)">
      <animateMotion dur="13s" repeatCount="indefinite" path="M200,176 A400,96 0 1 0 1000,176 A400,96 0 1 0 200,176"/>
    </circle>
    <circle r="3" fill="#D9CBFF">
      <animateMotion dur="13s" repeatCount="indefinite" path="M200,176 A400,96 0 1 0 1000,176 A400,96 0 1 0 200,176"/>
    </circle>

    <!-- HUD corners -->
    <g stroke="#00E5FF" stroke-opacity=".5" stroke-width="1.5" fill="none">
      <path d="M24 46V24H46"/><path d="M1176 46V24H1154"/>
      <path d="M24 294V316H46"/><path d="M1176 294V316H1154"/>
    </g>

    <!-- telemetry: top left -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="2.2">
      <text x="62" y="34" fill="#4E7BB0">SYS/ONLINE</text>
      <circle cx="52" cy="30" r="3.2" fill="#3FB950">
        <animate attributeName="opacity" values="1;.15;1" dur="1.7s" repeatCount="indefinite"/>
      </circle>
      <text x="1148" y="34" fill="#4E7BB0" text-anchor="end">LAT -15.79 / LON -47.88</text>
      <text x="52" y="312" fill="#4E7BB0">BRASILIA · DF · BR</text>
      <text x="1148" y="312" fill="#4E7BB0" text-anchor="end">9+ YRS IN ORBIT</text>
    </g>

    <!-- title block -->
    <text x="600" y="150" text-anchor="middle" fill="url(#ink)"
          font-family="Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif"
          font-size="62" font-weight="700" letter-spacing="9">MAIKON PEDROSA</text>

    <rect x="380" y="170" width="440" height="1.5" fill="url(#rule)"/>

    <text x="600" y="200" text-anchor="middle" fill="#7FD8F5"
          font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="15" letter-spacing="7.5">SENIOR SOFTWARE ENGINEER</text>

    <text x="600" y="232" text-anchor="middle" fill="#5C7D9E"
          font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="11.5" letter-spacing="3.4">JAVA · SPRING BOOT · PYTHON · GENERATIVE AI · KUBERNETES · AWS</text>

    <!-- payload chips -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.8" text-anchor="middle">
      <g>
        <rect x="416" y="252" width="112" height="24" rx="12" fill="#0E1B2E" stroke="#1F6FEB" stroke-opacity=".45"/>
        <text x="472" y="267.5" fill="#8FB6DE">DISTRIBUTED</text>
      </g>
      <g>
        <rect x="540" y="252" width="120" height="24" rx="12" fill="#0E1B2E" stroke="#00E5FF" stroke-opacity=".45"/>
        <text x="600" y="267.5" fill="#7FD8F5">RAG · AGENTS</text>
      </g>
      <g>
        <rect x="672" y="252" width="112" height="24" rx="12" fill="#0E1B2E" stroke="#7C4DFF" stroke-opacity=".45"/>
        <text x="728" y="267.5" fill="#B49CFF">HIGH AVAIL.</text>
      </g>
    </g>

    <!-- scan sweep -->
    <rect x="-320" y="0" width="320" height="340" fill="url(#sweep)" opacity=".16">
      <animate attributeName="x" from="-320" to="1200" dur="6.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="1200" height="1.5" fill="url(#sweep)" opacity=".7">
      <animate attributeName="y" values="24;316;24" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="338.5" rx="14" fill="none" stroke="#1F6FEB" stroke-opacity=".35"/>
</svg>
